
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Closet Mix | Adicionar produto</title>
    <link rel="stylesheet" href="admin.css">

    <style>
        body {
            background: #F8F5EF;
            color: #35434A;
            font-family: Arial, sans-serif;
        }

        .pagina {
            max-width: 850px;
            margin: auto;
            padding: 25px;
        }

        .cabecalho {
            margin-bottom: 25px;
        }

        .cabecalho h1 {
            margin-bottom: 8px;
        }

        .formulario {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,.06);
        }

        .grupo {
            margin-bottom: 18px;
        }

        .grupo label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .grupo input,
        .grupo select,
        .grupo textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .grupo textarea {
            min-height: 110px;
            resize: vertical;
        }

        .linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .preview {
            width: 100%;
            max-width: 220px;
            max-height: 220px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
            background: #eee;
        }

        .botoes {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .botoes button,
        .botoes a {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .salvar {
            background: #397C91;
            color: white;
        }

        .cancelar {
            background: #E8D8BC;
            color: #35434A;
        }

        .mensagem {
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .linha {
                grid-template-columns: 1fr;
            }

            .pagina {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<main class="pagina">

    <header class="cabecalho">
        <h1>Adicionar produto</h1>
        <p>Cadastre novas peças e acessórios na Closet Mix.</p>
    </header>

    <form id="formProduto" class="formulario">

        <div class="grupo">
            <label for="nome">Nome do produto *</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Ex: Jaqueta jeans vintage"
                maxlength="150"
                required
            >
        </div>

        <div class="grupo">
            <label for="descricao">Descrição *</label>
            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descreva as características do produto..."
                required
            ></textarea>
        </div>

        <div class="linha">

            <div class="grupo">
                <label for="preco">Preço (R$) *</label>
                <input
                    type="number"
                    id="preco"
                    name="preco"
                    min="0.01"
                    step="0.01"
                    placeholder="Ex: 59.90"
                    required
                >
            </div>

            <div class="grupo">
                <label for="quantidade">Quantidade *</label>
                <input
                    type="number"
                    id="quantidade"
                    name="quantidade"
                    min="0"
                    step="1"
                    placeholder="Ex: 5"
                    required
                >
            </div>

        </div>

        <div class="linha">

            <div class="grupo">
                <label for="categoria">Categoria *</label>
                <select id="categoria" name="id_categoria" required>
                    <option value="">Carregando categorias...</option>
                </select>
            </div>

            <div class="grupo">
                <label for="tamanho">Tamanho</label>
                <select id="tamanho" name="tamanho">
                    <option value="">Não se aplica</option>
                    <option value="PP">PP</option>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>
                    <option value="Único">Único</option>
                </select>
            </div>

        </div>

        <div class="grupo">
            <label for="condicao">Condição da peça *</label>
            <select id="condicao" name="condicao" required>
                <option value="">Selecione</option>
                <option value="novo">Novo</option>
                <option value="seminovo">Seminovo</option>
                <option value="usado">Usado</option>
            </select>
        </div>

        <div class="grupo">
            <label for="imagem">Imagem do produto *</label>
            <input
                type="file"
                id="imagem"
                name="imagem"
                accept="image/jpeg,image/png,image/webp"
                required
            >
            <img id="preview" class="preview" alt="Prévia do produto">
            <small>Formatos permitidos: JPG, PNG e WEBP. Máximo de 5 MB.</small>
        </div>

        <div class="botoes">
            <button type="submit" class="salvar" id="btnSalvar">
                Cadastrar produto
            </button>

            <a href="painel.html" class="cancelar">
                Voltar ao painel
            </a>
        </div>

        <p id="mensagem" class="mensagem" role="status"></p>

    </form>

</main>

<script>
    const API = "http://localhost:3000/api";

    const formulario = document.getElementById("formProduto");
    const campoImagem = document.getElementById("imagem");
    const preview = document.getElementById("preview");
    const mensagem = document.getElementById("mensagem");
    const btnSalvar = document.getElementById("btnSalvar");

    // Carrega as categorias cadastradas no banco
    async function carregarCategorias() {
        const campo = document.getElementById("categoria");

        try {
            const resposta = await fetch(`${API}/categorias`, {
                credentials: "include"
            });

            if (!resposta.ok) {
                throw new Error("Não foi possível carregar as categorias.");
            }

            const dados = await resposta.json();
            const categorias = Array.isArray(dados)
                ? dados
                : dados.categorias || [];

            campo.innerHTML = '<option value="">Selecione uma categoria</option>';

            categorias.forEach(categoria => {
                const opcao = document.createElement("option");

                opcao.value = categoria.id_categoria;
                opcao.textContent = categoria.nome;

                campo.appendChild(opcao);
            });

            if (categorias.length === 0) {
                campo.innerHTML = '<option value="">Cadastre uma categoria primeiro</option>';
            }

        } catch (erro) {
            campo.innerHTML = '<option value="">Erro ao carregar categorias</option>';
            console.error(erro);
        }
    }

    // Mostra a prévia da imagem selecionada
    campoImagem.addEventListener("change", () => {
        const arquivo = campoImagem.files[0];

        preview.style.display = "none";
        preview.removeAttribute("src");

        if (!arquivo) return;

        const tiposPermitidos = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if (!tiposPermitidos.includes(arquivo.type)) {
            mensagem.textContent = "Selecione uma imagem JPG, PNG ou WEBP.";
            campoImagem.value = "";
            return;
        }

        if (arquivo.size > 5 * 1024 * 1024) {
            mensagem.textContent = "A imagem deve ter no máximo 5 MB.";
            campoImagem.value = "";
            return;
        }

        const leitor = new FileReader();

        leitor.onload = evento => {
            preview.src = evento.target.result;
            preview.style.display = "block";
        };

        leitor.readAsDataURL(arquivo);
        mensagem.textContent = "";
    });

    // Envia o produto para o backend
    formulario.addEventListener("submit", async evento => {
        evento.preventDefault();

        mensagem.textContent = "";

        const preco = Number(document.getElementById("preco").value);
        const quantidade = Number(document.getElementById("quantidade").value);

        if (!Number.isFinite(preco) || preco <= 0) {
            mensagem.textContent = "Informe um preço válido.";
            return;
        }

        if (!Number.isInteger(quantidade) || quantidade < 0) {
            mensagem.textContent = "Informe uma quantidade válida.";
            return;
        }

        const arquivo = campoImagem.files[0];

        if (!arquivo || arquivo.size > 5 * 1024 * 1024) {
            mensagem.textContent = "Selecione uma imagem válida de até 5 MB.";
            return;
        }

        const dados = new FormData(formulario);

        btnSalvar.disabled = true;
        btnSalvar.textContent = "Cadastrando...";

        try {
            const resposta = await fetch(`${API}/produtos`, {
                method: "POST",
                credentials: "include",
                body: dados
            });

            const resultado = await resposta.json();

            if (!resposta.ok) {
                throw new Error(
                    resultado.erro || "Não foi possível cadastrar o produto."
                );
            }

            mensagem.textContent = "Produto cadastrado com sucesso!";
            mensagem.style.color = "green";

            formulario.reset();
            preview.style.display = "none";
            preview.removeAttribute("src");

            await carregarCategorias();

        } catch (erro) {
            mensagem.textContent = erro.message;
            mensagem.style.color = "red";
        } finally {
            btnSalvar.disabled = false;
            btnSalvar.textContent = "Cadastrar produto";
        }
    });

    carregarCategorias();
</script>

</body>
</html>
